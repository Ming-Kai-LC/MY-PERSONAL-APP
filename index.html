<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Mirror Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Infinite Mirror Effect</h1>
        <p class="subtitle">Reflection within reflection within reflection...</p>

        <div class="canvas-wrapper">
            <canvas id="mirrorCanvas"></canvas>
            <video id="webcam" autoplay playsinline style="display: none;"></video>
        </div>

        <div class="controls">
            <button id="startBtn">Start Mirror</button>
            <button id="stopBtn" disabled>Stop Mirror</button>

            <div class="sliders">
                <div class="slider-group">
                    <label for="scaleSlider">Recursion Scale: <span id="scaleValue">0.95</span></label>
                    <input type="range" id="scaleSlider" min="0.85" max="0.99" step="0.01" value="0.95">
                </div>

                <div class="slider-group">
                    <label for="rotationSlider">Rotation: <span id="rotationValue">0.5</span>°</label>
                    <input type="range" id="rotationSlider" min="0" max="5" step="0.1" value="0.5">
                </div>

                <div class="slider-group">
                    <label for="depthSlider">Mirror Depth: <span id="depthValue">20</span></label>
                    <input type="range" id="depthSlider" min="5" max="50" step="1" value="20">
                </div>

                <div class="slider-group">
                    <label for="offsetSlider">Offset: <span id="offsetValue">2</span>px</label>
                    <input type="range" id="offsetSlider" min="0" max="10" step="0.5" value="2">
                </div>
            </div>
        </div>

        <div class="info">
            <p>💡 <strong>Tip:</strong> Adjust the controls to create different infinite mirror effects!</p>
            <p>Move your hands or objects in front of the camera for a trippy experience.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
